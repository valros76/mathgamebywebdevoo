<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="crystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="arcane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.6" />

  <!-- Mystical Runes Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#arcane)" stroke-width="4" stroke-dasharray="12 8" opacity="0.4" />
  <circle cx="256" cy="256" r="204" fill="none" stroke="url(#crystal)" stroke-width="2" opacity="0.3" />

  <!-- D20 Geometric Core -->
  <polygon points="256,90 380,180 340,330 172,330 132,180" fill="url(#arcane)" opacity="0.25" />
  <polygon points="256,120 360,195 320,315 192,315 152,195" fill="none" stroke="url(#crystal)" stroke-width="4" filter="url(#glow)" />
  
  <!-- Central Math Crystal / Sword of Wisdom -->
  <!-- Sword blade / Compass needle -->
  <path d="M256,70 L274,210 L256,230 L238,210 Z" fill="url(#crystal)" filter="url(#glow)" />
  <path d="M256,230 L276,270 L256,430 L236,270 Z" fill="url(#gold)" />
  <!-- Sword Guard / Math Balance Bar -->
  <rect x="176" y="240" width="160" height="14" rx="7" fill="url(#gold)" filter="url(#glow)" />
  <circle cx="176" cy="247" r="10" fill="#f59e0b" />
  <circle cx="336" cy="247" r="10" fill="#f59e0b" />

  <!-- Magical Math Symbols Floating Around -->
  <!-- Plus + -->
  <path d="M140,140 L140,170 M125,155 L155,155" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" />
  <!-- Times x -->
  <path d="M355,140 L385,170 M385,140 L355,170" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" />
  <!-- Square root √ -->
  <path d="M125,370 L135,370 L145,390 L160,345 L180,345" fill="none" stroke="url(#crystal)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Pi π -->
  <path d="M340,350 L376,350 M350,350 L350,385 M368,350 L368,385" stroke="url(#crystal)" stroke-width="7" stroke-linecap="round" />

  <!-- Glowing Core Gem -->
  <circle cx="256" cy="247" r="22" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="256" cy="247" r="12" fill="#ffffff" />

  <!-- Star sparkles -->
  <polygon points="256,160 260,175 275,179 260,183 256,198 252,183 237,179 252,175" fill="#fef08a" />
</svg>
